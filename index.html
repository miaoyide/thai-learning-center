<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<script>
  // 先於畫面渲染套用已存的主題，避免閃爍；沒存過（或無法讀取）就預設白天模式
  const THEME_IDS = ["light", "hollow", "cyberpunk", "expedition", "confluence", "notion", "obsidian"];
  let theme = "light";
  try { theme = localStorage.getItem("theme") || "light"; } catch (e) {}
  if (theme === "dark") theme = "hollow"; // 舊的「深色」主題已改為 Hollow Knight
  document.documentElement.dataset.theme = THEME_IDS.includes(theme) ? theme : "light";
</script>
<title>泰語學習</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button id="menuBtn" aria-label="開啟選單" aria-expanded="false">☰</button>
  <h1><a href="#home">泰語學習</a></h1>
  <!-- 桌面版：內容直接排在頁首；手機版：變成從左側滑出的側邊欄 -->
  <div id="sidebar">
    <nav id="nav" hidden>
      <button data-page="home">首頁</button>
      <button data-page="cards">字卡</button>
      <button data-page="articles">文章</button>
      <button data-page="videos">影片</button>
    </nav>
    <div class="hdr-right">
      <div class="themepick">
        <button id="themeBtn" title="切換主題" aria-haspopup="true">主題</button>
        <div id="themeMenu" hidden></div>
      </div>
      <div id="authBox"></div>
    </div>
  </div>
</header>
<div id="sideOverlay"></div>

<main id="app" hidden>
  <!-- 首頁 -->
  <section id="home" hidden></section>

  <!-- 列表頁（字卡／影片／文章共用） -->
  <div id="browse" hidden>
    <div class="toolbar">
      <input id="search">
      <button id="importBtn" title="一次貼上多筆資料">匯入</button>
      <button id="editBtn" disabled>編輯</button>
      <button id="delBtn" disabled>刪除</button>
      <button id="addBtn">＋ 新增</button>
    </div>
    <div class="tabs" id="tabs">
      <input type="checkbox" id="selAll" title="全選（目前列表）">
      <span id="typeTabs">
        <button data-type="all" class="on">全部</button>
        <button data-type="word">單字</button>
        <button data-type="sentence">句子</button>
        <button data-type="weak" id="weakTab">需加強</button>
        <button id="maskBtn" title="遮罩：隱藏泰文與拼音，點一下卡片顯示答案">遮罩</button>
      </span>
    </div>
    <div class="tagbar" id="tagbar" hidden></div>
    <div id="cards"></div>
  </div>

  <!-- 影片播放頁 / 文章閱讀頁 -->
  <!-- 隨堂測驗 -->
  <div id="quiz" hidden></div>

  <div id="player" hidden></div>
  <div id="reader" hidden></div>
</main>

<div id="loginHint" class="loginbox">
  <p>請先以 Google 登入。</p>
  <p id="loginMsg" class="err"></p>
  <button id="loginBtn">Google 登入</button>
  <button id="guestBtn" title="不登入，只能瀏覽字卡、文章與影片">以訪客身分瀏覽（唯讀）</button>
</div>

<!-- 反白泰文時出現的浮窗（字卡說明、文章、影片字幕皆可用） -->
<div id="selPop" hidden>
  <span id="selText" lang="th"></span>
  <button type="button" id="selPlay" title="發音"></button>
  <button type="button" id="selAdd" title="加入字卡"></button>
</div>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">新增字卡</h2>
    <label>分類
      <select id="fType"><option value="word">單字</option><option value="sentence">句子</option></select>
    </label>
    <label>泰文 <input id="fThai" required lang="th"></label>
    <label>羅馬拼音 <input id="fRoman"></label>
    <label>英文 <input id="fEnglish"></label>
    <label>我的備註（例如容易搞混的地方，展開字卡時顯示）
      <input id="fNote">
    </label>
    <label class="chk"><input type="checkbox" id="fWeak"> 標記為「需加強」</label>
    <label>標籤（情境，點選或輸入後按 Enter）
      <div class="taginput" id="fTags"><input placeholder="例如：餐廳"></div>
    </label>
    <label>詳細說明（支援 Markdown，可直接貼 AI 回答）
      <textarea id="fDetail" rows="10"></textarea>
    </label>
    <div class="row">
      <button type="button" id="cancelBtn">取消</button>
      <button type="submit">儲存</button>
    </div>
  </form>
</dialog>

<dialog id="importDlg">
  <form id="importForm" method="dialog">
    <h2>批次匯入字卡</h2>
    <p class="hint">一行一筆：<code>泰文 | 羅馬拼音 | 英文</code>（也可用 Tab 分隔，可直接從試算表貼上）。泰文後面的詞性如 <code>(v)</code> 會自動移到英文後面。</p>
    <label>分類（套用到全部）
      <select id="iType"><option value="word">單字</option><option value="sentence">句子</option></select>
    </label>
    <label>標籤（套用到全部，可留空）
      <div class="taginput" id="iTags"><input placeholder="例如：日常"></div>
    </label>
    <label>內容
      <textarea id="importText" rows="10" placeholder="นั่ง | nâng | sit&#10;ยืน (v) | yuuen | stand"></textarea>
    </label>
    <div class="row">
      <span class="hint" id="importCount"></span>
      <button type="button" id="importCancel">取消</button>
      <button type="submit">匯入</button>
    </div>
  </form>
</dialog>

<dialog id="vdlg">
  <form id="vform" method="dialog">
    <h2 id="vdlgTitle">新增影片</h2>
    <label>YouTube 連結 <input id="vUrl" required placeholder="https://www.youtube.com/watch?v=..."></label>
    <label>標題（可留空，會自動抓取） <input id="vTitle"></label>
    <label>標籤（情境，點選或輸入後按 Enter）
      <div class="taginput" id="vTags"><input placeholder="例如：旅遊"></div>
    </label>
    <label>泰文字幕（YouTube「顯示轉錄稿」複製，或 .srt / .vtt 內容）
      <textarea id="vThai" rows="8" required lang="th" placeholder="0:12&#10;สวัสดีครับ&#10;0:15&#10;ขอยืมเงินหน่อย"></textarea>
    </label>
    <label>英文翻譯（選填，一行對應一句泰文）
      <textarea id="vEnglish" rows="5"></textarea>
    </label>
    <label>羅馬拼音（選填，一行對應一句泰文）
      <textarea id="vRoman" rows="5"></textarea>
    </label>
    <div class="row">
      <button type="button" id="vCancel">取消</button>
      <button type="submit">儲存</button>
    </div>
  </form>
</dialog>

<dialog id="adlg">
  <form id="aform" method="dialog">
    <h2 id="adlgTitle">新增文章</h2>
    <label>標題 <input id="aTitle" required lang="th"></label>
    <label>英文副標題（選填） <input id="aSubtitle"></label>
    <label>標籤（情境，點選或輸入後按 Enter）
      <div class="taginput" id="aTags"><input placeholder="例如：新聞"></div>
    </label>
    <label>內容（支援 Markdown，可直接貼 AI 回答或網頁文章）
      <textarea id="aBody" rows="14" required lang="th"></textarea>
    </label>
    <div class="row">
      <button type="button" id="aCancel">取消</button>
      <button type="submit">儲存</button>
    </div>
  </form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
