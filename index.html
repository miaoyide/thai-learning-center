<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<script>
  // 先於畫面渲染套用已存的主題，避免閃爍；沒存過就跟隨系統
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<title>泰語字卡</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>泰語字卡</h1>
  <div class="hdr-right">
    <button id="maskBtn" title="遮罩：隱藏泰文與拼音，點一下顯示答案">遮罩</button>
    <button id="themeBtn" title="切換淺色／深色"></button>
    <div id="authBox"></div>
  </div>
</header>

<main id="app" hidden>
  <div class="toolbar">
    <input id="search" placeholder="搜尋泰文 / 拼音 / 英文…">
    <button id="editBtn" disabled>編輯</button>
    <button id="delBtn" disabled>刪除</button>
    <button id="addBtn">＋ 新增</button>
  </div>
  <div class="tabs" id="tabs">
    <input type="checkbox" id="selAll" title="全選（目前列表）">
    <button data-type="all" class="on">全部</button>
    <button data-type="word">單字</button>
    <button data-type="sentence">句子</button>
    <button data-type="video">影片</button>
  </div>
  <div class="tagbar" id="tagbar" hidden></div>
  <div id="cards"></div>
  <div id="player" hidden></div>
</main>

<p id="loginHint">請先以 Google 登入。</p>

<!-- 在詳細說明內反白泰文時出現的浮窗 -->
<div id="selPop" hidden>
  <span id="selText" lang="th"></span>
  <button type="button" id="selPlay" title="發音"></button>
  <button type="button" id="selAdd" title="加入字卡"></button>
</div>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">新增字卡</h2>
    <label>分類
      <select id="fType"><option value="word">單字</option><option value="sentence">句子</option></select>
    </label>
    <label>泰文 <input id="fThai" required lang="th"></label>
    <label>羅馬拼音 <input id="fRoman"></label>
    <label>英文 <input id="fEnglish"></label>
    <label>標籤（情境，點選或輸入後按 Enter）
      <div class="taginput" id="fTags"><input placeholder="例如：餐廳"></div>
    </label>
    <label>詳細說明（支援 Markdown，可直接貼 AI 回答）
      <textarea id="fDetail" rows="10"></textarea>
    </label>
    <div class="row">
      <button type="button" id="cancelBtn">取消</button>
      <button type="submit">儲存</button>
    </div>
  </form>
</dialog>

<dialog id="vdlg">
  <form id="vform" method="dialog">
    <h2 id="vdlgTitle">新增影片</h2>
    <label>YouTube 連結 <input id="vUrl" required placeholder="https://www.youtube.com/watch?v=..."></label>
    <label>標題（可留空，會自動抓取） <input id="vTitle"></label>
    <label>標籤（情境，點選或輸入後按 Enter）
      <div class="taginput" id="vTags"><input placeholder="例如：旅遊"></div>
    </label>
    <label>泰文字幕（YouTube「顯示轉錄稿」複製，或 .srt / .vtt 內容）
      <textarea id="vThai" rows="8" required lang="th" placeholder="0:12&#10;สวัสดีครับ&#10;0:15&#10;ขอยืมเงินหน่อย"></textarea>
    </label>
    <label>英文翻譯（選填，一行對應一句泰文）
      <textarea id="vEnglish" rows="5"></textarea>
    </label>
    <label>羅馬拼音（選填，一行對應一句泰文）
      <textarea id="vRoman" rows="5"></textarea>
    </label>
    <div class="row">
      <button type="button" id="vCancel">取消</button>
      <button type="submit">儲存</button>
    </div>
  </form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
